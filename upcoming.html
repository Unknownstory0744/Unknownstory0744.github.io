<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
</head>

<body>
    <div class="grain-overlay"></div>

    <nav>
        <a href="index.html" class="nav-brand">The Memories</a>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="memories.html">Memories</a>
            <a href="her.html">About Her</a>
            <a href="thoughts.html">Thoughts</a>
            <a href="letter.html">The Letter</a>
            <a href="upcoming.html" class="active">Upcoming</a>
        </div>
        <div class="nav-actions">
            <div class="audio-toggle" id="audio-toggle">
                <span class="audio-icon">Sound Off</span>
                <div class="audio-bars">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>
            <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle Menu">
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main>
        <div id="lock-screen" style="max-width: 480px; margin: 40px auto 0; text-align: center; transition: opacity 0.4s ease;">
            <div class="glass-card" style="padding: 48px 36px;">
                <div style="width: 48px; height: 48px; margin: 0 auto 22px; border-radius: 50%; border: 1px solid var(--accent-teal); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(45, 212, 191, 0.25);">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-teal);">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h2 style="font-family: var(--font-serif); font-size: 2.2rem; font-style: italic; margin-bottom: 12px; background: linear-gradient(135deg, #ffffff 40%, #c084fc 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Protected Space</h2>
                <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 28px; letter-spacing: 0.05em;">Enter the passcode to view upcoming fragments.</p>
                <form id="unlock-form">
                    <input type="password" id="passcode-input" inputmode="numeric" placeholder="Passcode" autocomplete="off" style="width: 100%; padding: 14px 20px; background: rgba(6, 9, 19, 0.7); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 10px; color: var(--text-primary); font-size: 1.1rem; text-align: center; letter-spacing: 0.3em; margin-bottom: 18px; outline: none; transition: all 0.3s ease;">
                    <button type="submit" class="landing-btn" style="width: 100%; margin-top: 0; padding: 14px 0; font-size: 0.8rem;">Unlock</button>
                    <p id="error-msg" style="color: #f87171; font-size: 0.85rem; margin-top: 14px; opacity: 0; transition: opacity 0.3s ease; min-height: 1.2em;"></p>
                </form>
            </div>
        </div>

        <div id="unlocked-content" style="display: none; opacity: 0; transition: opacity 0.8s ease;"></div>

        <footer style="margin-top: 200px; text-align: center; opacity: 0.2; font-weight: 300; font-size: 0.75rem; letter-spacing: 0.2em;">
            THE MEMORIES
        </footer>
    </main>

    <div class="visitor-counter-pill" title="Total Visitors">
        <span class="visitor-pulse-dot"></span>
        <img src="https://hits.sh/unknownstory0744.github.io.svg?style=flat&label=VISITORS&color=2dd4bf&labelColor=0c1222" alt="Visitors" class="visitor-badge-img">
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
